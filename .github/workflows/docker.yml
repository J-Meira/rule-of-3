on:
  release:
    types: [published]

name: Docker

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Make envfile
        run: |
          echo "VITE_VERSION=${GITHUB_REF_NAME}" >> .env
          echo "VITE_V_DATE=$(date +'%Y-%m-%dT%H:%M:%S')" >> .env
          cat .env

      - name: Build and Push Docker Image
        run: |
          docker build . -t ${{ vars.REPOSITORY_NAME }}:${{ github.ref_name }} --build-arg NPM_TOKEN=${{ secrets.NPM_PASS }}
          docker push ${{ vars.REPOSITORY_NAME }}:${{ github.ref_name }}
